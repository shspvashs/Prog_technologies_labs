services:
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/index.php:/var/www/html/index.php
    depends_on:
      - php

  php:
    build: ./php
    volumes:
      - ./nginx/index.php:/var/www/html/index.php
    depends_on:
      - postgres
      - mysql
      - redis

  postgres:
    build: ./postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

  mysql:
    build: ./mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mysql
    command: >
      sh -c "
      mysqld --user=mysql --datadir=/var/lib/mysql --skip-networking=0 & 
      sleep 5 && 
      mysql -u root --socket=/run/mysqld/mysqld.sock -e \"CREATE USER IF NOT EXISTS 'root'@'%' IDENTIFIED BY 'root'; GRANT ALL PRIVILEGES ON *.* TO 'root'@'%' WITH GRANT OPTION; FLUSH PRIVILEGES;\" && 
      wait
      "   

  redis:
    build: ./redis
